/* ==========================================================================
   Rovia System – temă comună a suitei
   Pentru a potrivi exact fundalul și culorile Rovia, modificați variabilele de
   mai jos SAU încărcați logo-ul și fundalul din aplicație: Setări → Aspect.
   ========================================================================== */
:root {
  --font: "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", system-ui, -apple-system, sans-serif;
  --font-num: "Segoe UI Variable Display", "Segoe UI", Roboto, system-ui, sans-serif;

  /* Culori de brand (suprascrise din Setări → Aspect) */
  --accent: #3B82F6;
  --accent-2: #22D3EE;
  --accent-ink: #ffffff;
  --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
  --accent-line: color-mix(in srgb, var(--accent) 45%, transparent);

  /* Fundal Rovia */
  --bg: #060A13;
  --bg-image: none;
  --bg-layers:
    radial-gradient(1100px 620px at 8% -12%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 62%),
    radial-gradient(900px 520px at 108% 4%, color-mix(in srgb, var(--accent-2) 16%, transparent), transparent 60%),
    radial-gradient(800px 600px at 50% 120%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 60%),
    linear-gradient(180deg, #0A1122 0%, #060A13 100%);

  /* Suprafețe */
  --surface: rgba(15, 23, 42, 0.72);
  --surface-2: rgba(30, 41, 59, 0.66);
  --surface-3: rgba(51, 65, 85, 0.55);
  --surface-solid: #0F172A;
  --border: rgba(148, 163, 184, 0.14);
  --border-strong: rgba(148, 163, 184, 0.26);

  /* Text */
  --text: #E8EDF5;
  --text-2: #B8C2D3;
  --muted: #8391A7;

  /* Stări */
  --ok: #10B981;
  --warn: #F59E0B;
  --danger: #EF4444;
  --info: #38BDF8;
  --ok-soft: rgba(16, 185, 129, .15);
  --warn-soft: rgba(245, 158, 11, .15);
  --danger-soft: rgba(239, 68, 68, .15);

  --radius: 14px;
  --radius-sm: 10px;
  --radius-lg: 20px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, .5);
  --blur: saturate(140%) blur(14px);

  --rail: 88px;
  --topbar: 60px;
  --tap: 48px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ==========================================================================
   Temă luminoasă (Setări → Aspect → Temă) – fundal alb, text închis
   ========================================================================== */
:root[data-theme="light"] {
  --accent-soft: color-mix(in srgb, var(--accent) 13%, transparent);
  --accent-line: color-mix(in srgb, var(--accent) 45%, transparent);
  --accent-text: color-mix(in srgb, var(--accent) 72%, #0B1220);

  --bg: #EEF2F8;
  --bg-layers:
    radial-gradient(1100px 620px at 8% -12%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 62%),
    radial-gradient(900px 520px at 108% 4%, color-mix(in srgb, var(--accent-2) 12%, transparent), transparent 60%),
    linear-gradient(180deg, #F8FAFD 0%, #E9EEF6 100%);

  --surface: rgba(255, 255, 255, 0.84);
  --surface-2: rgba(241, 245, 250, 0.94);
  --surface-3: rgba(203, 213, 225, 0.75);
  --surface-solid: #FFFFFF;
  --border: rgba(15, 23, 42, 0.10);
  --border-strong: rgba(15, 23, 42, 0.18);

  --text: #0F172A;
  --text-2: #334155;
  --muted: #64748B;

  --ok: #059669;
  --warn: #D97706;
  --danger: #DC2626;
  --info: #0284C7;
  --ok-soft: rgba(5, 150, 105, .12);
  --warn-soft: rgba(217, 119, 6, .13);
  --danger-soft: rgba(220, 38, 38, .10);

  --shadow: 0 8px 24px rgba(15, 23, 42, .08);
  --shadow-lg: 0 20px 50px rgba(15, 23, 42, .18);
  --blur: saturate(160%) blur(14px);
  color-scheme: light;
}

/* ============================ Rovia POS · stiluri ============================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--font); color: var(--text); font-size: 15px; line-height: 1.4;
  background-color: var(--bg);
  background-image: var(--bg-image), var(--bg-layers);
  background-size: cover; background-position: center; background-attachment: fixed;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none; user-select: none;
}
input, textarea, [contenteditable] { user-select: text; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-2); }
img { max-width: 100%; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.text-2 { color: var(--text-2); }
.small { font-size: 12.5px; }
.xs { font-size: 11.5px; }
.big { font-size: 20px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.right { text-align: right; }
.center { text-align: center; }
.bold { font-weight: 700; }
.nowrap { white-space: nowrap; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.top { align-items: flex-start; }
.row.between { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1 1 auto; min-width: 0; }
.spacer { flex: 1; }
.gap-s { gap: 6px; } .gap-l { gap: 18px; }
.mt { margin-top: 14px; } .mb { margin-bottom: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .grid2, .grid3, .grid4 { grid-template-columns: 1fr; } }
.ok-t { color: var(--ok); } .warn-t { color: var(--warn); } .danger-t { color: var(--danger); } .accent-t { color: var(--accent-2); }

/* ------------------------------------------------------------------ Boot */
.boot { height: 100vh; display: grid; place-items: center; align-content: center; gap: 26px; }
.boot-logo { height: 64px; opacity: .95; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--surface-3); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------------------------------------------------------------- Butoane */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px;
  border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text);
  font-weight: 600; cursor: pointer; transition: background .15s, transform .08s, border-color .15s, opacity .15s; white-space: nowrap; touch-action: manipulation;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn svg { width: 19px; height: 19px; flex: none; }
.btn.primary { background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, var(--accent-2))); border-color: transparent; color: var(--accent-ink); box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ok { background: var(--ok); border-color: transparent; color: #04241a; }
.btn.warn { background: var(--warn); border-color: transparent; color: #2b1a00; }
.btn.danger { background: var(--danger-soft); border-color: rgba(239, 68, 68, .45); color: #FCA5A5; }
.btn.danger.solid { background: var(--danger); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.outline { background: transparent; }
.btn.lg { min-height: 56px; font-size: 16.5px; padding: 0 22px; border-radius: var(--radius); }
.btn.xl { min-height: 68px; font-size: 19px; padding: 0 26px; border-radius: var(--radius); }
.btn.sm { min-height: 34px; padding: 0 11px; font-size: 13.5px; }
.btn.icon { width: 42px; padding: 0; }
.btn.icon.sm { width: 34px; }
.btn.block { width: 100%; }
.btn.active { background: var(--accent-soft); border-color: var(--accent-line); color: #fff; }

.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface-2); cursor: pointer; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.chip.active { background: var(--accent-soft); border-color: var(--accent-line); color: #fff; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--surface-3); color: var(--text-2); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: #6EE7B7; }
.badge.warn { background: var(--warn-soft); color: #FCD34D; }
.badge.danger { background: var(--danger-soft); color: #FCA5A5; }
.badge.info { background: rgba(56, 189, 248, .15); color: #7DD3FC; }
.badge.accent { background: var(--accent-soft); color: #fff; }

/* ------------------------------------------------------------- Formulare */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 12.5px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.input, .field input, .field select, .field textarea, select.input {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong);
  background: rgba(2, 6, 23, .45); outline: none; transition: border-color .15s, box-shadow .15s;
}
.field textarea { min-height: 80px; resize: vertical; }
.input:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
select option { background: var(--surface-solid); }
.input-icon { position: relative; }
.input-icon svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.input-icon .input { padding-left: 38px; }
.check { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; min-height: 40px; }
.switch { position: relative; width: 46px; height: 26px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--surface-3); transition: .2s; }
.switch i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .2s; }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(20px); }
.color-input { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border-strong); padding: 3px; background: transparent; cursor: pointer; }
fieldset { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin: 0; }
legend { padding: 0 6px; color: var(--text-2); font-weight: 700; font-size: 13px; }

/* ---------------------------------------------------------------- Panouri */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); box-shadow: var(--shadow); }
.panel.pad { padding: 18px; }
.panel-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.panel-h h3 { margin: 0; font-size: 15.5px; }
.panel-b { padding: 16px 18px; }
.card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
h1, h2, h3, h4 { margin: 0; letter-spacing: -.01em; }
h2 { font-size: 20px; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin: 4px 0 8px; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.empty svg { width: 42px; height: 42px; opacity: .5; margin-bottom: 8px; }

/* ---------------------------------------------------------------- Tabele */
.table-wrap { overflow: auto; border-radius: var(--radius); border: 1px solid var(--border); }
table.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { position: sticky; top: 0; z-index: 1; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-solid); padding: 10px 12px; border-bottom: 1px solid var(--border-strong); white-space: nowrap; }
.table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.table tbody tr:hover td { background: rgba(148, 163, 184, .05); }
.table tr.click { cursor: pointer; }
.table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table tfoot td { font-weight: 800; background: var(--surface-2); border-top: 1px solid var(--border-strong); }
.table tr.low td { background: rgba(239, 68, 68, .06); }

/* ----------------------------------------------------------------- Tab-uri */
.tabs { display: flex; gap: 6px; padding: 4px; background: rgba(2, 6, 23, .4); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; min-height: 38px; padding: 0 16px; border-radius: 9px; border: 0; background: transparent; color: var(--text-2); font-weight: 650; cursor: pointer; white-space: nowrap; }
.tab.active { background: var(--surface-3); color: #fff; box-shadow: inset 0 0 0 1px var(--border-strong); }

/* ------------------------------------------------------------------ Login */
.login { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
.login-brand { padding: 48px; display: flex; flex-direction: column; justify-content: space-between; }
.login-brand .logo { height: 58px; align-self: flex-start; }
.login-brand h1 { font-size: 44px; line-height: 1.05; margin-top: 18px; letter-spacing: -.03em; }
.login-brand h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.login-brand p { color: var(--text-2); max-width: 460px; font-size: 16px; }
.login-mods { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.login-card { margin: 24px; align-self: center; padding: 28px; }
.users-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; max-height: 260px; overflow: auto; padding: 2px; }
.user-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; transition: .15s; }
.user-tile:hover { border-color: var(--border-strong); }
.user-tile.active { border-color: var(--accent); background: var(--accent-soft); }
.avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; flex: none; font-size: 15px; }
.avatar.sm { width: 30px; height: 30px; font-size: 12px; }
.pin-dots { display: flex; justify-content: center; gap: 12px; margin: 18px 0 14px; }
.pin-dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border-strong); }
.pin-dots i.on { background: var(--accent); border-color: var(--accent); }
.pin-dots.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
@media (max-width: 900px) { .login { grid-template-columns: 1fr; } .login-brand { padding: 28px 24px 0; } .login-brand h1 { font-size: 32px; } .login-brand .foot { display: none; } }

/* ----------------------------------------------------------------- Numpad */
.numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.numpad button { min-height: 60px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2); font-size: 22px; font-weight: 650; cursor: pointer; font-family: var(--font-num); touch-action: manipulation; }
.numpad button:active { background: var(--surface-3); transform: scale(.97); }
.numpad button.fn { font-size: 15px; color: var(--text-2); }
.numpad.compact button { min-height: 50px; font-size: 19px; }

/* ------------------------------------------------------------------ Shell */
.shell { display: grid; grid-template-columns: var(--rail) 1fr; height: 100vh; height: 100dvh; }
.rail { display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 12px 8px; background: rgba(4, 8, 18, .62); border-right: 1px solid var(--border); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); overflow-y: auto; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.rail .brand { display: grid; place-items: center; padding: 4px 0 12px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
.rail .brand img { width: 52px; height: 52px; object-fit: contain; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: 12px; color: var(--text-2); text-decoration: none; font-size: 11.5px; font-weight: 650; text-align: center; transition: .15s; position: relative; }
.nav-item svg { width: 24px; height: 24px; }
.nav-item:hover { background: var(--surface-2); color: #fff; }
.nav-item.active { background: var(--accent-soft); color: #fff; }
.nav-item.active::before { content: ""; position: absolute; left: -8px; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--accent); }
.nav-item .count { position: absolute; top: 4px; right: 8px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 10.5px; display: grid; place-items: center; }
.rail .foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding-top: 8px; border-top: 1px solid var(--border); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { height: var(--topbar); display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid var(--border); background: rgba(4, 8, 18, .35); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); flex: none; }
.topbar h1 { font-size: 18px; font-weight: 750; }
.topbar .crumb { color: var(--muted); font-weight: 600; font-size: 14px; }
.topbar .clock { font-family: var(--font-num); font-weight: 650; color: var(--text-2); font-variant-numeric: tabular-nums; }
.conn { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.conn.on { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.view { flex: 1; min-height: 0; overflow: auto; padding: 18px; }
.view.flush { padding: 0; overflow: hidden; }
.view-pad { padding: 18px; }
.page { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.page-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.page-head h2 { margin-right: auto; }
.shell.fullscreen { grid-template-columns: 1fr; }
.shell.fullscreen .rail { display: none; }
@media (max-width: 640px) {
  .shell { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .rail { grid-row: 2; flex-direction: row; padding: 6px; border-right: 0; border-top: 1px solid var(--border); overflow-x: auto; }
  .rail .brand, .rail .foot { display: none; }
  .rail nav { flex-direction: row; }
  .nav-item { min-width: 70px; padding: 6px 4px; font-size: 10.5px; }
  .nav-item svg { width: 22px; height: 22px; }
  .topbar { overflow-x: auto; scrollbar-width: none; }
  .topbar .crumb, .topbar .clock { display: none; }
  .nav-item.active::before { display: none; }
  .view { padding: 12px; }
  .topbar { padding: 0 12px; }
}

/* ------------------------------------------------------------------ Modal */
.modal-back { position: fixed; inset: 0; background: rgba(2, 6, 16, .66); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 18px; z-index: 100; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(560px, 100%); max-height: calc(100dvh - 36px); display: flex; flex-direction: column; background: color-mix(in srgb, var(--surface-solid) 96%, transparent); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); animation: pop .18s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes pop { from { transform: translateY(10px) scale(.98); opacity: 0; } }
.modal.sm { width: min(420px, 100%); }
.modal.lg { width: min(860px, 100%); }
.modal.xl { width: min(1120px, 100%); }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.modal-h h3 { font-size: 17px; margin-right: auto; }
.modal-b { padding: 18px; overflow: auto; }
.modal-f { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 18px; border-top: 1px solid var(--border); flex-wrap: wrap; }

/* ------------------------------------------------------------------ Toast */
#toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 10px; z-index: 200; pointer-events: none; }
.toast { min-width: 260px; max-width: 420px; padding: 12px 14px; border-radius: 12px; background: var(--surface-solid); border: 1px solid var(--border-strong); box-shadow: var(--shadow-lg); display: flex; gap: 10px; align-items: flex-start; pointer-events: auto; animation: slide .2s; }
.toast svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.toast.ok svg { color: var(--ok); } .toast.err svg { color: var(--danger); } .toast.warn svg { color: var(--warn); } .toast.info svg { color: var(--info); }
.toast.ready { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 18%, var(--surface-solid)); }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }

/* ------------------------------------------------------------- Dashboard */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.kpi { padding: 16px 18px; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--border); backdrop-filter: var(--blur); }
.kpi .label { color: var(--muted); font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 8px; }
.kpi .label svg { width: 16px; height: 16px; }
.kpi .value { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-num); font-size: clamp(22px, 2.1vw, 28px); font-weight: 750; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi .sub { color: var(--text-2); font-size: 13px; }
.kpi.accent { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 30%, transparent), color-mix(in srgb, var(--accent-2) 12%, transparent)), var(--surface); border-color: var(--accent-line); }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 170px; padding-top: 10px; }
.bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; min-width: 0; }
.bars .b i { width: 100%; max-width: 34px; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, var(--accent-2), var(--accent)); min-height: 2px; }
.bars .b span { font-size: 11px; color: var(--muted); }
.module-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.module-tile { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border); text-decoration: none; color: var(--text); font-weight: 650; transition: .15s; }
.module-tile:hover { border-color: var(--accent-line); background: var(--accent-soft); }
.module-tile .ic { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--accent-soft); color: #fff; flex: none; }
.module-tile svg { width: 21px; height: 21px; }
.list { display: flex; flex-direction: column; }
.list-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.list-item:last-child { border-bottom: 0; }

/* -------------------------------------------------------------- POS / Casă */
.pos { display: grid; grid-template-columns: minmax(0, 1fr) 400px; height: 100%; min-height: 0; }
.pos-left { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 14px; gap: 12px; }
.pos-right { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--border); background: rgba(4, 8, 18, .55); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
@media (max-width: 980px) { .pos { grid-template-columns: minmax(0, 1fr) 340px; } }
.pos-wrap { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.pos-wrap > .pos { flex: 1; min-height: 0; }
.pos-switch { display: none; }
/* Telefon: meniul și nota pe rând, cu comutator sus */
@media (max-width: 720px) {
  .pos { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  .pos-right { border-left: 0; }
  .pos:not(.show-cart) .pos-right { display: none; }
  .pos.show-cart .pos-left { display: none; }
  .pos-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px 10px 0; flex: none; }
  .pos-switch button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); font: inherit; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; }
  .pos-switch button svg { width: 18px; height: 18px; flex: none; }
  .pos-switch button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pos-switch button.bump { animation: bump .35s; }
  .pos-left { padding: 10px; }
}
@keyframes bump { 40% { transform: scale(1.06); } }
.search-bar { display: flex; gap: 8px; }
.search-bar .input-icon { flex: 1; }
.search-bar .input { min-height: 48px; font-size: 16px; }
.cats { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: none; padding-bottom: 2px; }
.cats::-webkit-scrollbar { display: none; }
.cats .chip { min-height: 40px; padding: 0 14px; }
.prod-grid { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); grid-auto-rows: 104px; gap: 10px; align-content: start; padding: 2px; }
.prod { position: relative; display: flex; flex-direction: column; justify-content: space-between; text-align: left; padding: 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; overflow: hidden; transition: transform .08s, border-color .15s, background .15s; touch-action: manipulation; }
.prod::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, var(--accent)); }
.prod:hover { border-color: var(--border-strong); background: var(--surface-3); }
.prod:active { transform: scale(.96); }
.prod .n { font-weight: 650; font-size: 14.5px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.prod .p { font-family: var(--font-num); font-weight: 750; font-size: 16px; color: #fff; }
.prod .s { position: absolute; right: 8px; bottom: 10px; font-size: 11px; }
.prod.out { opacity: .55; }
.prod.flash { animation: flash .35s; }
@keyframes flash { 50% { background: var(--accent-soft); border-color: var(--accent); } }

.cart-h { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.cart-h h3 { font-size: 16px; margin-right: auto; }
.cart-lines { flex: 1; overflow: auto; padding: 6px 8px; }
.cart-line { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 10px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; }
.cart-line:hover { background: var(--surface-2); }
.cart-line.sel { background: var(--accent-soft); border-color: var(--accent-line); }
.cart-line .n { font-weight: 650; }
.cart-line .t { font-family: var(--font-num); font-weight: 750; text-align: right; }
.cart-line .d { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.cart-line .note { color: var(--warn); font-size: 12.5px; }
.cart-line.cancelled { opacity: .5; text-decoration: line-through; }
.cart-line.fresh { border-left: 3px solid var(--accent-2); }
.qty-ctl { display: flex; align-items: center; gap: 6px; }
.qty-ctl button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--surface-2); font-size: 18px; font-weight: 700; cursor: pointer; display: grid; place-items: center; }
.qty-ctl b { min-width: 34px; text-align: center; font-family: var(--font-num); }
.cart-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--border); }
.cart-tools .btn { flex: none; }
.cart-totals { padding: 12px 16px 6px; border-top: 1px solid var(--border); }
.cart-totals .r { display: flex; justify-content: space-between; color: var(--text-2); font-size: 14px; padding: 2px 0; }
.cart-totals .grand { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; }
.cart-totals .grand b { font-family: var(--font-num); font-size: 32px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.cart-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 12px 14px; }
.cart-actions .btn.pay { grid-column: 1 / -1; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* --------------------------------------------------------------- Plată */
.pay-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; }
@media (max-width: 760px) { .pay-grid { grid-template-columns: minmax(0, 1fr); } }
.pay-total { padding: 16px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border); }
.pay-total .big { font-family: var(--font-num); font-size: 38px; font-weight: 800; letter-spacing: -.02em; }
.pay-methods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pay-methods .btn { min-height: 58px; }
.pay-amount { font-family: var(--font-num); font-size: 30px; font-weight: 750; padding: 10px 14px; border-radius: var(--radius); background: rgba(2, 6, 23, .5); border: 1px solid var(--accent-line); text-align: right; min-height: 60px; }
.pay-list .list-item { padding: 8px 0; }
.change-box { padding: 14px; border-radius: var(--radius); background: var(--ok-soft); border: 1px solid rgba(16, 185, 129, .4); display: flex; justify-content: space-between; align-items: baseline; }
.change-box b { font-family: var(--font-num); font-size: 28px; color: #6EE7B7; }

/* ----------------------------------------------------------- Plan sală */
.floor-wrap { display: flex; flex-direction: column; height: 100%; gap: 12px; padding: 14px; }
.floor { position: relative; flex: 1; min-height: 360px; border-radius: var(--radius-lg); border: 1px solid var(--border); background:
  radial-gradient(circle at 1px 1px, rgba(148, 163, 184, .12) 1px, transparent 0) 0 0 / 26px 26px, var(--surface); overflow: hidden; }
.tbl { position: absolute; width: 15%; min-width: 96px; aspect-ratio: 1.25; border-radius: 16px; border: 2px solid var(--border-strong); background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; transition: transform .1s, border-color .15s, background .15s; touch-action: none; padding: 6px; text-align: center; }
.tbl.round { border-radius: 50%; aspect-ratio: 1; width: 11%; min-width: 88px; }
.tbl .tn { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.tbl .tt { font-family: var(--font-num); font-weight: 700; font-size: 14px; }
.tbl .tw { font-size: 11.5px; color: var(--text-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl:active { transform: scale(.97); }
.tbl.busy { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 24%, var(--surface-solid)); }
.tbl.bill { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 20%, var(--surface-solid)); }
.tbl.ready { border-color: var(--ok); animation: pulse 1.4s infinite; }
.tbl.locked { opacity: .45; }
.tbl .flag { position: absolute; top: -8px; right: -8px; }
.floor.editing .tbl { cursor: grab; border-style: dashed; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, .55); } 50% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }
.takeaway-list { display: flex; gap: 8px; overflow-x: auto; }
/* Planul se derulează când ecranul e mai mic decât sala (mesele nu se mai suprapun) */
.floor-scroll { flex: 1; min-height: 0; overflow: auto; border-radius: var(--radius-lg); display: flex; }
.floor-scroll > .floor { flex: 1; min-width: 880px; min-height: 520px; }
.floor-scroll.grid-mode > .floor { min-width: 0; min-height: 0; }
/* Grilă: toate mesele zonei, ordonate după nume – pentru telefoane */
.floor.grid-mode { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; padding: 12px; align-content: start; overflow: visible; }
.floor.grid-mode .tbl { position: relative; left: auto !important; top: auto !important; width: auto; min-width: 0; aspect-ratio: 1.15; }
.floor.grid-mode .tbl.round { border-radius: 22px; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
.seg button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--text-2); font: inherit; font-weight: 700; font-size: 13px; padding: 7px 12px; border-radius: 9px; cursor: pointer; }
.seg button svg { width: 16px; height: 16px; }
.seg button.active { background: var(--surface-3, rgba(148,163,184,.2)); color: var(--text); }
@media (max-width: 700px) {
  .floor-wrap { padding: 10px; gap: 10px; }
  .floor-wrap .legend { display: none; }
  .floor.grid-mode { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; padding: 8px; }
  .tbl .tn { font-size: 18px; }
  .seg button span { display: none; }
}
@media (max-height: 520px) {
  .floor-wrap { padding: 8px 10px; gap: 8px; }
  .floor-wrap .legend { display: none; }
  .floor.grid-mode { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; padding: 8px; }
  .floor.grid-mode .tbl { aspect-ratio: 1.7; }
}
@media (max-width: 640px) {
  /* butoanele din bara de sus: doar pictograme, ca să încapă pe telefon */
  .topbar .btn.sm { font-size: 0; gap: 0; padding: 0 10px; }
  .topbar .btn.sm svg { width: 20px; height: 20px; }
}

/* -------------------------------------------------------- Ecran bucătărie */
.kds { display: flex; flex-direction: column; height: 100%; }
.kds-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.kds-body { flex: 1; display: grid; grid-template-columns: 1fr 250px; min-height: 0; }
.kds-grid { overflow: auto; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; align-content: start; }
.kds-side { border-left: 1px solid var(--border); overflow: auto; padding: 14px; background: rgba(4, 8, 18, .45); }
@media (max-width: 900px) { .kds-body { grid-template-columns: 1fr; } .kds-side { display: none; } }
.ticket { display: flex; flex-direction: column; border-radius: var(--radius); background: var(--surface-solid); border: 1px solid var(--border-strong); overflow: hidden; box-shadow: var(--shadow); animation: pop .25s; }
.ticket-h { padding: 10px 12px; display: flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--ok) 22%, var(--surface-solid)); border-bottom: 1px solid var(--border); }
.ticket.warn .ticket-h { background: color-mix(in srgb, var(--warn) 28%, var(--surface-solid)); }
.ticket.late .ticket-h { background: color-mix(in srgb, var(--danger) 34%, var(--surface-solid)); }
.ticket-h .tn { font-size: 21px; font-weight: 850; letter-spacing: -.01em; }
.ticket-h .age { margin-left: auto; font-family: var(--font-num); font-size: 18px; font-weight: 800; }
.ticket-m { padding: 6px 12px; font-size: 12.5px; color: var(--text-2); display: flex; gap: 8px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.ticket-items { padding: 4px 6px; flex: 1; }
.titem { display: flex; gap: 10px; padding: 9px 8px; border-radius: 10px; cursor: pointer; align-items: flex-start; }
.titem:hover { background: var(--surface-2); }
.titem .q { font-family: var(--font-num); font-size: 20px; font-weight: 850; min-width: 32px; }
.titem .n { font-size: 17px; font-weight: 700; line-height: 1.25; }
.titem .nt { color: var(--warn); font-weight: 700; font-size: 14px; margin-top: 2px; }
.titem.preparing { background: rgba(56, 189, 248, .1); }
.titem.preparing .n::after { content: " · în lucru"; color: var(--info); font-size: 12px; font-weight: 700; }
.titem.ready { opacity: .45; text-decoration: line-through; }
.ticket-f { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; border-top: 1px solid var(--border); }
.ticket.done { opacity: .7; }
.sum-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--border); font-weight: 650; }
.sum-row b { font-family: var(--font-num); font-size: 18px; }

/* ---------------------------------------------------------------- Calendar */
.cal { display: grid; overflow: auto; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); position: relative; }
.cal-head { position: sticky; top: 0; z-index: 3; background: var(--surface-solid); padding: 10px; font-weight: 700; border-bottom: 1px solid var(--border-strong); border-left: 1px solid var(--border); text-align: center; }
.cal-time { position: sticky; left: 0; z-index: 2; background: var(--surface-solid); font-size: 12px; color: var(--muted); text-align: right; padding: 2px 8px; border-bottom: 1px solid var(--border); font-family: var(--font-num); }
.cal-cell { border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); cursor: pointer; min-height: 30px; }
.cal-cell:hover { background: var(--accent-soft); }
.cal-cell.half { border-bottom-style: dashed; }
.appt { position: absolute; border-radius: 10px; padding: 6px 8px; font-size: 12.5px; cursor: pointer; overflow: hidden; border-left: 4px solid var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 30%, var(--surface-solid)); box-shadow: var(--shadow); z-index: 1; }
.appt b { display: block; font-size: 13.5px; }
.appt.done { opacity: .6; }
.appt.cancelled, .appt.noshow { opacity: .35; text-decoration: line-through; }

/* ---------------------------------------------------------------- Rapoarte */
.rep { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; min-height: 100%; }
.rep > * { min-width: 0; }
@media (max-width: 900px) { .rep { grid-template-columns: 1fr; } }
.rep-menu { padding: 10px; align-self: start; position: sticky; top: 0; }
.rep-menu .grp { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; margin: 12px 8px 6px; }
.rep-menu button { display: block; width: 100%; text-align: left; padding: 9px 10px; border-radius: 9px; border: 0; background: transparent; cursor: pointer; font-weight: 600; color: var(--text-2); }
.rep-menu button:hover { background: var(--surface-2); color: #fff; }
.rep-menu button.active { background: var(--accent-soft); color: #fff; }

/* --------------------------------------------------------------- Diverse */
.kbd { display: inline-block; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--border-strong); font-size: 11.5px; color: var(--text-2); font-family: var(--font-num); }
.divider { height: 1px; background: var(--border); margin: 8px 0; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { width: 30px; height: 30px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; }
.swatch.active { border-color: #fff; }
.drop { border: 2px dashed var(--border-strong); border-radius: var(--radius); padding: 18px; text-align: center; color: var(--muted); cursor: pointer; }
.drop:hover { border-color: var(--accent); color: var(--text); }
.logo-prev { height: 64px; max-width: 220px; object-fit: contain; background: rgba(255, 255, 255, .03); border-radius: 10px; padding: 6px; }
.bg-prev { height: 90px; width: 160px; border-radius: 10px; background-size: cover; background-position: center; border: 1px solid var(--border); }
.mod-card { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2); }
.mod-card .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); flex: none; }
.mod-card .ic svg { width: 22px; height: 22px; }
.mod-card.off { opacity: .6; }
.video-box { position: relative; border-radius: var(--radius); overflow: hidden; background: #000; aspect-ratio: 4/3; }
.video-box video { width: 100%; height: 100%; object-fit: cover; }
.video-box::after { content: ""; position: absolute; left: 12%; right: 12%; top: 45%; height: 2px; background: var(--danger); box-shadow: 0 0 12px var(--danger); }
pre.preview { background: #fff; color: #111; font: 12.5px/1.35 ui-monospace, Consolas, monospace; padding: 14px; border-radius: 10px; overflow: auto; max-height: 420px; white-space: pre; }

/* ---------------------------------------------------------------- Tipărire */
.print-area { display: none; }
@media print {
  body { background: #fff !important; color: #000; }
  body > *:not(#print-root) { display: none !important; }
  #print-root { display: block !important; }
  #print-root table { width: 100%; border-collapse: collapse; font-size: 11px; }
  #print-root th, #print-root td { border-bottom: 1px solid #ccc; padding: 4px 6px; text-align: left; }
  #print-root td.num, #print-root th.num { text-align: right; }
  #print-root tfoot td { font-weight: 700; border-top: 2px solid #000; }

/* ------------------------------------------------ Apeluri de la mese (QR) */

.call { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border-radius: 16px; background: color-mix(in srgb, var(--accent) 22%, var(--surface-solid)); border: 2px solid var(--accent); box-shadow: var(--shadow-lg); animation: callin .25s ease-out, callpulse 1.6s ease-in-out infinite; }
.call.bill { background: color-mix(in srgb, var(--warn) 22%, var(--surface-solid)); border-color: var(--warn); }

@media (max-width: 640px) { .calls { top: auto; bottom: 84px; right: 8px; left: 8px; width: auto; } }
.tbl .callflag { position: absolute; top: -10px; left: -10px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; animation: callpulse 1.4s infinite; box-shadow: var(--shadow-lg); }
.tbl .callflag.bill { background: var(--warn); }
.tbl .callflag svg { width: 16px; height: 16px; }
.tbl.billreq { border-color: var(--warn); }
.qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.qr-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--border); text-align: center; }
.qr-card .qr { background: #fff; border-radius: 12px; padding: 8px; line-height: 0; }

/* masa altui ospătar – doar vizualizare */

/* Performanță pe tablete și telefoane: fără estompare (backdrop-filter) și fără fundal fix – cele mai costisitoare
   efecte de randare pe procesoarele slabe. Arată aproape la fel, dar derularea și atingerile sunt mult mai rapide. */
@media (pointer: coarse) {
  :root { --blur: none; }
  body { background-attachment: scroll; }
  .panel, .rail, .topbar, .pos-right, .modal, .modal-back, .update-overlay, .kds-side { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  .tbl, .btn, .chip { transition: none; }
}
html.lite { --blur: none; }
html.lite body { background-attachment: scroll; }
html.lite *, html.lite *::before, html.lite *::after { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }

/* ---------------------------------------------------------------- Rezervări (1.9.17) */
:root { --res: #A855F7; --res-soft: rgba(168, 85, 247, .18); }

.tabs .tab { border: 0; background: transparent; padding: 8px 14px; border-radius: 9px; font-weight: 650; color: var(--text-2); cursor: pointer; white-space: nowrap; }
.tabs .tab.active { background: var(--accent-soft); color: #fff; }
.note { color: var(--muted); font-size: 12.5px; }
.loading { display: grid; place-items: center; padding: 60px 0; }
@media (max-width: 640px) {
  .toolbar { padding: 8px 12px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .toolbar::-webkit-scrollbar { display: none; }
  .toolbar > * { flex: none; }
  .toolbar .sep, .toolbar .spacer { display: none; }
  .kpis { grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi { padding: 12px; } .kpi .value { font-size: 19px; } .kpi .sub { font-size: 11.5px; }
  .topbar .ro, .topbar .crumb, .uname { display: none; }
  .loc-select { max-width: 150px; }
  .loc-grid { grid-template-columns: 1fr; }
  .nav-item.back { border-bottom: 0; }
}
@media print { .rail, .toolbar, .tbl-tools { display: none !important; } .shell { display: block; height: auto; } .view { overflow: visible; } }
.switch { display: inline-block; vertical-align: middle; }

/* ------------------------------------------------ Monitorizare în timp real */
.live-dot { width: 10px; height: 10px; border-radius: 50%; background: #10B981; box-shadow: 0 0 0 4px rgba(16,185,129,.2); animation: pulse 1.6s infinite; }
.mon-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.mon-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 14px; align-items: start; }
@media (max-width: 1000px) { .mon-grid { grid-template-columns: minmax(0, 1fr); } }
.mon-open { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.mon-card { padding: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border); cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.mon-card:hover { border-color: var(--accent-line); }
.mon-card.bill { border-color: var(--warn); }
.mon-card.canc { box-shadow: inset 3px 0 0 var(--danger); }
.mon-card.old .mon-dur { color: var(--danger); }
.mon-card .big { font-family: var(--font-num); font-weight: 800; font-size: 18px; }
.mon-dur { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent-2); font-size: 13px; }
.mon-items { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mon-feed { display: flex; flex-direction: column; gap: 6px; max-height: calc(100dvh - 330px); min-height: 300px; overflow: auto; }
.mon-ev { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); border-left: 4px solid var(--border-strong); cursor: pointer; }
.mon-ev.fresh { animation: fresh 3s ease-out; }
@keyframes fresh { from { background: color-mix(in srgb, var(--accent) 30%, var(--surface-2)); } }
.mon-ev.sev-alert { border-left-color: var(--danger); background: color-mix(in srgb, var(--danger) 9%, var(--surface-2)); }
.mon-ev.sev-warn { border-left-color: var(--warn); }
.mon-ev.sev-money { border-left-color: var(--ok); }
.mon-ev.sev-ok { border-left-color: #22D3EE; }
.mon-ev.sev-low { opacity: .8; }
.mon-ev.sev-alert .mon-l1 b { color: #FCA5A5; }
.mon-time { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; color: var(--text-2); min-width: 64px; padding-top: 1px; }
.mon-ic svg { width: 18px; height: 18px; color: var(--muted); }
.mon-l1 { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mon-l2 { color: var(--text-2); font-size: 12.5px; }
.mon-l3 { font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; background: rgba(148,163,184,.16); font-size: 12px; font-weight: 700; }
.mon-bar .input { width: auto; min-height: 38px; padding: 6px 10px; }
.mon-bar input[type=date] { color-scheme: dark; }
.mon-bar input[type=search], .mon-bar .input:not([type]) { min-width: 240px; flex: 0 1 340px; }
.nav-sep { height: 1px; background: var(--border); margin: 6px 8px; }

</style>

    if (parts[0] === 'r' && S.meta[parts[1]]) {
      const loc = parts[1]; const m = S.meta[loc]; const v = MON_VIEWS[parts[2]] ? parts[2] : 'days';
      title = `${MON_NAV.find((x) => x[0] === v)[1]} · ${m.name}`; crumb = `${roDate(S.from)} – ${roDate(S.to)}`; showTb = true;
      nav = [h('a.nav-item', { href: '#/monitor' }, I('eye'), 'Timp real'), h('div.nav-sep'), ...MON_NAV.map(([id, n, ic]) => h('a.nav-item', { href: `#/r/${loc}/${id}`, class: id === v ? 'active' : '' }, I(ic), n))];
      const ctx = { loc, locName: m.name, cur: m.currency || 'RON', from: S.from, to: S.to, period: `${S.from}_${S.to}`, slug: String(m.name || loc).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '_').toLowerCase(),
        openDay: (d) => { S.from = d; S.to = d; S.preset = ''; setPresetStore(); if (location.hash === `#/r/${loc}/receipts`) route(); else location.hash = `#/r/${loc}/receipts`; } };
      mount(sh.locSel, S.locs.length > 1 ? h('select.input.loc-select', { onchange: (e) => { location.hash = `#/r/${e.target.value}/${v}`; } }, S.locs.map((l) => h('option', { value: l.id, selected: l.id === loc }, l.name))) : null);
      page = () => MON_VIEWS[v](ctx);
      liveReload(loc, my);
    } else if (parts[0] !== 'monitor') { location.hash = '#/monitor'; return; }
    else { title = 'Monitorizare'; crumb = 'note și evenimente în timp real'; nav = mainNav('monitor'); mount(sh.locSel); page = () => monitorPage({ locs: S.locs, stops: S.stops }); }
  } else if (parts[0] === 'monitor') { location.hash = '#/'; return; }
  else if (parts[0] === 'l' && S.meta[parts[1]]) {
    const loc = parts[1]; const m = S.meta[loc]; const v = VIEWS[parts[2]] || parts[2] === 'live' ? parts[2] : 'dashboard';
    const cur = m.currency || 'RON';
    title = m.name; crumb = v === 'catalog' ? 'produse, prețuri, categorii' : v === 'live' ? 'note, încasări și evenimente în timp real' : `${roDate(S.from)} – ${roDate(S.to)}`; showTb = v !== 'catalog' && v !== 'live';
    const locNav = [LOC_NAV[0], ['live', 'Timp real', 'eye'], ...LOC_NAV.slice(1).filter(([id]) => !(OWNER && id === 'catalog'))];
    nav = [h('a.nav-item.back', { href: '#/' }, I('back'), 'Locații'), ...locNav.map(([id, n, ic]) => h('a.nav-item', { href: `#/l/${loc}/${id}`, class: id === v ? 'active' : '' }, I(ic), n)), remoteNav(loc, my)];
    const ctx = { loc, locName: m.name, cur, from: S.from, to: S.to, period: `${S.from}_${S.to}`, stops: S.stops, userName: S.user.name || S.user.email || '', canWrite: canWrite(), slug: String(m.name || loc).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '_').toLowerCase(), go: (x) => { location.hash = `#/l/${loc}/${x}`; } };
    mount(sh.locSel, S.locs.length > 1 ? h('select.input.loc-select', { onchange: (e) => { location.hash = `#/l/${e.target.value}/${v}`; } }, S.locs.map((l) => h('option', { value: l.id, selected: l.id === loc }, l.name))) : null);
    page = v === 'live' ? () => monitorPage({ locs: S.locs.filter((l) => l.id === loc), stops: S.stops }) : () => VIEWS[v](ctx);
    // actualizare în timp real când perioada include ziua de azi
    if (['dashboard', 'sales', 'products', 'staff', 'payments', 'protocol', 'cancel', 'nc'].includes(v)) liveReload(loc, my);
  } else if (parts[0] === 'compare') {
    title = 'Comparație locații'; crumb = `${roDate(S.from)} – ${roDate(S.to)}`; showTb = true; nav = mainNav('compare'); mount(sh.locSel); page = comparePage;
  } else if (parts[0] === 'admin' && S.user.role === 'admin' && !OWNER) {
    title = 'Administrare'; nav = mainNav('admin'); mount(sh.locSel); page = () => adminPage({ user: S.user, uid: S.uid, locations: S.locs, go: (x) => { if (location.hash === x) route({ keepModals: true }); else location.hash = x; }, setTab: (t) => { S.adminTab = t; }, adminTab: S.adminTab });
  } else {
    title = OWNER ? 'Locațiile mele' : 'Locații'; crumb = 'astăzi, în timp real'; nav = mainNav('home'); mount(sh.locSel); page = homePage;
    if (S.user.role === 'admin' || S.user.all) {
      let first = true;
      S.stops.push(fb.stream('meta', (v) => { if (first) { first = false; return; } S.meta = v || {}; S.locs = Object.entries(S.meta).map(([id, x]) => ({ id, ...x })).sort((a, b) => String(a.name).localeCompare(String(b.name), 'ro')); if (my === seq && (location.hash || '#/').replace(/^#\/?/, '') === '') mount(sh.view, h('div.page', homeContent())); }));
    } else {
      // utilizator cu locații alese (ex. proprietarul): fiecare locație în timp real
      for (const l of S.locs) {
        let first = true;
        S.stops.push(fb.stream(`meta/${l.id}`, (v) => { if (first) { first = false; return; } if (!v) return; S.meta[l.id] = v; S.locs = Object.entries(S.meta).map(([id, x]) => ({ id, ...x })).sort((a, b) => String(a.name).localeCompare(String(b.name), 'ro')); if (my === seq) mount(sh.view, h('div.page', homeContent())); }));
      }
    }
  }
  sh.title.textContent = title; sh.crumb.textContent = crumb;
  mount(sh.nav, nav); renderToolbar(showTb);
  mount(sh.view, h('div.loading', h('div.spinner')));
  try {
    const content = await page();
    if (my === seq) mount(sh.view, h('div.page', content));
  } catch (e) {
    if (e.auth) return logout();
    if (my === seq) mount(sh.view, h('div.page', h('div.panel.pad.empty', I('alert'), h('div', e.message), h('div.mt', btn('Încearcă din nou', { icon: 'refresh', onClick: () => { data.clearCache(); route(); } })))));
  }
}
/** Reîncarcă pagina când sosesc bonuri noi (doar dacă perioada include ziua de azi) */
function liveReload(loc, my) {
  const today = iso(new Date());
  if (S.to < today) return;
  // valoarea de referință: dacă prima notificare diferă (o notă a sosit între timp), se reîncarcă
  const base = fb.get(`data/${loc}/dk/${today}`).then((v) => JSON.stringify(v ?? null)).catch(() => null);
  let first = true; let t;
  S.stops.push(fb.stream(`data/${loc}/dk/${today}`, async (v) => {
    const j = JSON.stringify(v ?? null);
    if (first) { first = false; if ((await base) === j) return; }
    clearTimeout(t); t = setTimeout(() => { data.clearCache(); if (my === seq) route(); }, 1200);
  }));
}
/** „POS la distanță”: linkul publicat de serverul locației (Setări → Acces de la distanță) */
function remoteNav(loc, my) {
  const a = h('a.nav-item.remote-pos', { href: '#', target: '_blank', rel: 'noopener', style: { display: 'none' }, title: 'Deschide Rovia POS al locației (autentificare cu PIN-ul de manager / administrator)' }, I('expand'), 'POS la distanță');
  fb.get(`data/${loc}/remote`).then((r) => { if (my === seq && r?.url) { a.href = r.url; a.style.display = ''; } }).catch(() => {});
  return a;
}
/** Dreptul de a modifica produsele din Controlling: administratorul sau utilizatorul cu „write” */
function canWrite() { return APP === 'controlling' && (S.user?.role === 'admin' || (S.user?.role === 'controller' && S.user?.write === true)); }
function mainNav(active) {
  if (APP === 'monitor') {
    const first = S.locs[0]?.id;
    return [h('a.nav-item', { href: '#/monitor', class: active === 'monitor' ? 'active' : '' }, I('eye'), 'Timp real'),
      first ? h('div.nav-sep') : null, ...(first ? MON_NAV.map(([id, n, ic]) => h('a.nav-item', { href: `#/r/${first}/${id}` }, I(ic), n)) : [])];
  }
  return [['home', '#/', 'Locații', 'layers'], ['compare', '#/compare', 'Comparație', 'chart'], S.user.role === 'admin' && !OWNER ? ['admin', '#/admin', 'Administrare', 'shield'] : null]
    .filter(Boolean).map(([id, href, n, ic]) => h('a.nav-item', { href, class: id === active ? 'active' : '' }, I(ic), n));
}
window.addEventListener('hashchange', route);

// ------------------------------------------------------------------ Locații (ecran principal)
function homePage() { return homeContent(); }
function homeContent() {
  const L = S.locs; const t = iso(new Date());
  if (!L.length) return [h('div.panel.pad', emptyBox(S.user.role === 'admin' ? 'Nicio locație conectată încă. Administrare → Locații → Adaugă locație, apoi conectați serverul Rovia POS cu codul primit.' : 'Nu aveți acces la nicio locație. Cereți administratorului acces.')),
    S.user.role === 'admin' ? h('div.row', btn('Adaugă prima locație', { cls: 'primary', icon: 'plus', onClick: () => { S.adminTab = 'locs'; location.hash = '#/admin'; } })) : null];
  const todayOf = (l) => (l.today?.d === t ? l.today : { sales: 0, n: 0 });
  const tot = L.reduce((a, l) => ({ sales: a.sales + (todayOf(l).sales || 0), n: a.n + (todayOf(l).n || 0), open: a.open + (l.open?.v || 0) }), { sales: 0, n: 0, open: 0 });
  const online = L.filter((l) => l.lastSync && (Date.now() - new Date(String(l.lastSync).replace(' ', 'T')).getTime()) < 15 * 60000).length;
  const cur = L[0]?.currency || 'RON';
  return [
    h('div.kpis',
      kpi('Vânzări azi', 'chart', money(tot.sales), `${cur} · toate locațiile`, 'accent'), kpi('Bonuri azi', 'receipt', qty(tot.n), `bon mediu ${money(tot.n ? tot.sales / tot.n : 0)}`),
      kpi('Mese deschise', 'table', money(tot.open), 'valoare în curs'), kpi('Locații online', 'wifi', `${online} / ${L.length}`, 'sincronizate în ultimele 15 min')),
    h('div.loc-grid', L.map((l) => {
      const td = todayOf(l); const last7 = new Map((Array.isArray(l.last7) ? l.last7 : Object.values(l.last7 || {})).map((x) => [x[0], x[1]]));
      const vals = []; for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); vals.push(Number(last7.get(iso(d))) || 0); }
      return h('a.panel.loc-card', { href: `#/l/${l.id}/dashboard` },
        h('div.row', h('div.grow', h('h3.ellipsis', l.name || 'Locație'), h('div.small.muted.ellipsis', [l.city, l.company].filter(Boolean).join(' · ') || '—')), statusDot(l.lastSync)),
        h('div.row.between', { style: { alignItems: 'flex-end' } },
          h('div', h('div.small.muted', 'Azi'), h('div.big-num', money(td.sales)), h('div.small.text-2', `${qty(td.n)} bonuri${l.open?.n ? ` · ${l.open.n} mese deschise (${money(l.open.v)})` : ''}`)),
          sparkline(vals)),
        h('div.small.muted', `Ultima sincronizare: ${roDate(l.lastSync) || '—'}`));
    })),
  ];
}

// ------------------------------------------------------------------ Comparație locații
async function comparePage() {
  const L = S.locs; if (!L.length) return emptyBox('Nu există locații.');
  const [pf, pt] = data.prevRange(S.from, S.to);
  const res = await Promise.all(L.map(async (l) => { const [a, b] = await Promise.all([data.dayTotals(l.id, S.from, S.to).catch(() => ({})), data.dayTotals(l.id, pf, pt).catch(() => ({}))]); return { l, t: data.sumTotals(a), p: data.sumTotals(b) }; }));
  const rows = res.map(({ l, t, p }) => ({ id: l.id, name: l.name, sales: t.sales, n: t.n, avg: t.n ? t.sales / t.n : 0, margin: t.net - t.cost, marginPct: t.net ? ((t.net - t.cost) / t.net) * 100 : 0, prot: t.prot, canc: t.canc, tips: t.tips, disc: t.disc, prev: p.sales }));
  const total = rows.reduce((a, r) => a + r.sales, 0);
  return [
    h('div.kpis', kpi('Vânzări', 'chart', money(total), h('span', L[0]?.currency || 'RON', deltaEl(total, rows.reduce((a, r) => a + r.prev, 0))), 'accent'), kpi('Bonuri', 'receipt', qty(rows.reduce((a, r) => a + r.n, 0))), kpi('Marjă (fără TVA)', 'percent', money(rows.reduce((a, r) => a + r.margin, 0))), kpi('Protocol', 'star', money(rows.reduce((a, r) => a + r.prot, 0)))),
    panel('Vânzări pe locații', hbars(rows.map((r) => [r.name, r.sales, r.n]).sort((a, b) => b[1] - a[1]), { count: 'bonuri', limit: 20, onClick: (n) => { const r = rows.find((x) => x.name === n); if (r) location.hash = `#/l/${r.id}/dashboard`; } })),
    h('div.panel.pad', dataTable([
      { t: 'Locație', k: 'name', f: (r) => h('b', r.name) }, { t: 'Vânzări', k: 'sales', num: true, sum: true }, { t: 'Față de perioada anterioară', k: 'delta', num: true, v: (r) => (r.prev ? (r.sales - r.prev) / r.prev : 0), f: (r) => deltaEl(r.sales, r.prev) || '—' },
      { t: 'Bonuri', k: 'n', num: true, sum: true, f: (r) => qty(r.n), fmtSum: qty }, { t: 'Bon mediu', k: 'avg', num: true }, { t: 'Marjă', k: 'margin', num: true, sum: true },
      { t: 'Marjă %', k: 'marginPct', num: true, f: (r) => `${nf0.format(r.marginPct)}%` }, { t: 'Reduceri', k: 'disc', num: true, sum: true }, { t: 'Protocol', k: 'prot', num: true, sum: true },
      { t: 'Bacșiș', k: 'tips', num: true, sum: true }, { t: 'Anulări', k: 'canc', num: true, sum: true, f: (r) => qty(r.canc), fmtSum: qty },
    ], rows, { name: 'comparatie_locatii', period: `${S.from}_${S.to}`, sortKey: 'sales', onRow: (r) => { location.hash = `#/l/${r.id}/dashboard`; } })),
  ];
}

// ------------------------------------------------------------------ pornire
async function boot() {
  applyBrand();
  let cfg = null;
  try { cfg = await fb.loadConfig(); } catch (e) { return setupScreen(e.message); }
  if (!cfg) return setupScreen();
  if (!fb.getSession()) return loginScreen();
  try { await start(); } catch (e) { if (e.auth) return loginScreen(e.message); loginScreen(e.message); }
}
window.addEventListener('error', (e) => { if (!S.shell) console.error(e.message); });
boot();

return {  };
})();
})();
</script>
